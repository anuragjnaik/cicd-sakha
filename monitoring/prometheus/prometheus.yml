global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: dev

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          team: devops

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: flask-app
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8080']
        labels:
          service: hello-world